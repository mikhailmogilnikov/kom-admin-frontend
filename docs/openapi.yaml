openapi: 3.1.0
info:
  title: KOM Admin API
  description: |
    REST API для админ-панели УК «Ключи Москвы».

    Scope спецификации соответствует **реализованному фронтенду**:
    - авторизация: access JWT в теле ответа + refresh token в HttpOnly cookie;
    - справочник жилых комплексов;
    - агрегированный дашборд.

    Разделы «Объекты», «Пользователи», «Заявки» на UI — заглушки, endpoints для них не описаны.
  version: 1.0.0
  license:
    name: Proprietary
  contact:
    name: Keys of Moscow

servers:
  - url: https://{host}/api/v1
    description: Production / staging
    variables:
      host:
        default: api.example.com
        description: Хост backend API

tags:
  - name: Auth
    description: Вход в админ-панель и профиль оператора
  - name: Reference
    description: Справочные данные
  - name: Dashboard
    description: Данные главной страницы дашборда

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход в админ-панель
      description: |
        Заменяет mock-токен в `useLogin`. При успехе:

        - **Тело ответа:** `accessToken` (короткоживущий JWT) — клиент кладёт в localStorage (`access_token`).
        - **Cookie `refresh_token`:** HttpOnly, Secure, SameSite=Lax — для обновления access без повторного ввода пароля.
          Недоступен из JavaScript; отправляется браузером только на auth-ручки при `credentials: "include"`.

        Декодирование access JWT на фронте: `sub`, `exp` (см. `decode-token.ts`).
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  email: admin@example.com
                  password: "password123"
      responses:
        "200":
          description: Успешная аутентификация
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_CREDENTIALS
                message: Неверный email или пароль
        "422":
          description: Ошибка валидации (zod на фронте — email, password 6–50)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление access token
      description: |
        Выдаёт новый `accessToken`, если валиден refresh token из cookie `refresh_token`.
        Используется при истечении `exp` access JWT (401 на защищённых ручках) или проактивно до истечения.

        Запрос **без** `Authorization`. Обязательно `credentials: "include"` (fetch) / `withCredentials: true` (axios),
        чтобы браузер отправил HttpOnly cookie.

        При ротации refresh сервер может вернуть новый `Set-Cookie` (рекомендуется).
      operationId: authRefresh
      security: []
      parameters:
        - $ref: "#/components/parameters/refreshTokenCookie"
      responses:
        "200":
          description: Новый access token
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetRefreshTokenCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Refresh token отсутствует, истёк или отозван
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                code: INVALID_REFRESH_TOKEN
                message: Сессия истекла, войдите снова

  /auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь админ-панели
      description: Данные для блока пользователя в шапке (`User` component).
      operationId: authMe
      responses:
        "200":
          description: Профиль оператора
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Токен отсутствует или недействителен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Выход из системы
      description: |
        Сервер отзывает refresh token и сбрасывает cookie `refresh_token` (`Set-Cookie` с `Max-Age=0`).
        Клиент удаляет `access_token` из localStorage.

        Рекомендуется вызывать с `Authorization: Bearer <accessToken>` и `credentials: "include"`.
        На фронте logout сейчас только очищает localStorage — после интеграции добавить этот запрос.
      operationId: authLogout
      parameters:
        - $ref: "#/components/parameters/refreshTokenCookie"
      responses:
        "204":
          description: Успешный выход
          headers:
            Set-Cookie:
              $ref: "#/components/headers/ClearRefreshTokenCookie"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /residential-complexes:
    get:
      tags: [Reference]
      summary: Список жилых комплексов
      description: |
        Справочник для `ComplexSelector`. Значение «Все комплексы» (`all`) —
        только на клиенте, в ответ API не входит.
      operationId: listResidentialComplexes
      responses:
        "200":
          description: Список ЖК
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidentialComplexListResponse"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Агрегированные данные дашборда
      description: |
        Один ответ для всей страницы `/_private/` (метрики, финансы, активность, все графики).

        **Источники данных** — см. `docs/models.rtf` (`ApartmentComplex`, `Sector`, `Flat`,
        `Contract`, `ContractPayment`, `Transaction`, `Application`).

        **Фильтр ЖК:** `complexId` = `ApartmentComplex.id` (integer). Без параметра — все ЖК;
        с `complexId` — детализация по `Sector` (дом/сектор) внутри ЖК.

        **Период:** `dateFrom` / `dateTo` влияют на динамику платежей, заявок и дохода
        (`Transaction.payment_date`, `Application.created_at`). Снимочные метрики «на сегодня»
        (занятость, статусы квартир) период не меняют.
      operationId: getDashboard
      parameters:
        - $ref: "#/components/parameters/complexId"
        - $ref: "#/components/parameters/dateFrom"
        - $ref: "#/components/parameters/dateTo"
      responses:
        "200":
          description: Данные дашборда
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
        "400":
          description: Некорректные query-параметры
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Короткоживущий JWT access token в заголовке `Authorization: Bearer <token>`.
        Payload на фронте: `sub` (number, id пользователя), `exp` (unix).
        См. `decodeToken` в `src/features/auth/lib/decode-token.ts`.

        Refresh token **не** передаётся в Bearer — только в HttpOnly cookie (см. `refreshTokenCookie`).

  parameters:
    refreshTokenCookie:
      name: refresh_token
      in: cookie
      required: false
      description: |
        Долгоживущий refresh token. HttpOnly, Secure, SameSite=Lax, Path `/api/v1/auth` (или `/`).
        Не читается и не записывается из JavaScript.
      schema:
        type: string

    complexId:
      name: complexId
      in: query
      required: false
      description: |
        `ApartmentComplex.id`. Omit — все комплексы (уровень ЖК на графиках).
        С `complexId` — детализация по `Sector` (поле `house` / `name`).
      schema:
        type: integer
        minimum: 1
      examples:
        sunnyCity:
          summary: Один ЖК
          value: 1

    dateFrom:
      name: dateFrom
      in: query
      required: false
      description: Начало периода (ISO 8601 date). Для `DateRangePicker` (UI пока не подключён).
      schema:
        type: string
        format: date
      example: "2026-05-01"

    dateTo:
      name: dateTo
      in: query
      required: false
      description: Конец периода (ISO 8601 date, включительно).
      schema:
        type: string
        format: date
      example: "2026-05-31"

  headers:
    SetRefreshTokenCookie:
      description: |
        Установка refresh token. Пример (значения `Max-Age`, `Domain` — на усмотрение backend):

        `refresh_token=<opaque>; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000`
      schema:
        type: string
      example: refresh_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000

    ClearRefreshTokenCookie:
      description: Сброс refresh token при logout
      schema:
        type: string
      example: refresh_token=; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=0

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          example: admin@example.com
        password:
          type: string
          minLength: 6
          maxLength: 50
          format: password
          example: password123

    LoginResponse:
      type: object
      required: [accessToken]
      description: |
        Только access token в JSON. Refresh token приходит отдельно в cookie `refresh_token` (см. login / refresh).
      properties:
        accessToken:
          type: string
          description: JWT для заголовка Authorization Bearer
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AdminUser:
      type: object
      required: [id, email, displayName, initials]
      properties:
        id:
          type: integer
          description: Совпадает с `sub` в JWT
          example: 1234567890
        email:
          type: string
          format: email
          example: admin@example.com
        displayName:
          type: string
          description: Отображаемое имя в шапке
          example: Ренат
        initials:
          type: string
          description: Инициалы для AvatarFallback
          example: РМ

    ResidentialComplex:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          description: "ApartmentComplex.id — передаётся в complexId на дашборде"
          example: 1
        name:
          type: string
          description: ApartmentComplex.name
          example: ЖК «Солнечный город»

    ResidentialComplexListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResidentialComplex"

    Money:
      type: object
      required: [amountMinor, currency]
      description: |
        Денежная сумма в минорных единицах (копейки для RUB).
        Фронт форматирует в «12.5М ₽», «285К ₽» на клиенте.
      properties:
        amountMinor:
          type: integer
          format: int64
          description: Сумма в копейках (может быть отрицательной для расходов)
          example: 1250000000
        currency:
          type: string
          enum: [RUB]
          default: RUB

    MetricSnapshotCaption:
      type: object
      required: [label]
      description: |
        Подпись под снимочной метрикой (без сравнения с прошлым периодом).
        Для «Всего объектов» и «Занятость» — всегда «на сегодняшний день».
      properties:
        label:
          type: string
          example: на сегодняшний день

    Trend:
      type: object
      required: [value, isPositive]
      description: |
        Процент изменения к предыдущему периоду (`dateFrom`/`dateTo`).
        **Не используется** для `totalUnits` и `occupancy` (нет истории занятости по дням).
      properties:
        value:
          type: number
          format: float
          description: Абсолютное значение процента (без знака %)
          example: 12
        isPositive:
          type: boolean
          example: true

    DashboardMetrics:
      type: object
      required:
        - totalUnits
        - totalUnitsCaption
        - occupancy
        - occupancyCaption
        - monthlyRevenue
        - averageRate
        - activeTenants
        - trends
      properties:
        totalUnits:
          type: integer
          description: |
            «Всего объектов» — `COUNT(Flat)` в scope фильтра (все квартиры в БД, не только в аренде).
          example: 82
        totalUnitsCaption:
          $ref: "#/components/schemas/MetricSnapshotCaption"
        occupancy:
          $ref: "#/components/schemas/OccupancyMetric"
        occupancyCaption:
          $ref: "#/components/schemas/MetricSnapshotCaption"
        monthlyRevenue:
          $ref: "#/components/schemas/Money"
          description: |
            «Доход за месяц» — `SUM(Transaction.amount)` за период по оплаченным счетам
            (`ContractPayment.status = PAYED` → `Transaction`).
        averageRate:
          $ref: "#/components/schemas/Money"
          description: |
            «Средняя ставка» — `AVG(Contract.default_amount)` по активным договорам
            (`start_date` ≤ сегодня ≤ `end_date`).
        activeTenants:
          type: integer
          description: |
            «Активных арендаторов» — уникальные `User` с `ContractUser.role = TENANT`
            по активным договорам.
          example: 71
        trends:
          $ref: "#/components/schemas/DashboardMetricTrends"

    OccupancyMetric:
      type: object
      required: [percent, occupied, total]
      properties:
        percent:
          type: integer
          minimum: 0
          maximum: 100
          example: 87
        occupied:
          type: integer
          example: 71
        total:
          type: integer
          example: 82

    DashboardMetricTrends:
      type: object
      required: [monthlyRevenue, averageRate, activeTenants]
      description: Тренды только для метрик, которые можно сравнить с предыдущим периодом
      properties:
        monthlyRevenue:
          $ref: "#/components/schemas/Trend"
        averageRate:
          $ref: "#/components/schemas/Trend"
        activeTenants:
          $ref: "#/components/schemas/Trend"

    ApplicationStatus:
      type: string
      enum: [OPENED, WAITING, POSTPONED, CLOSED]
      description: Application.status (EnumApplicationStatus)

    ApplicationsSummaryItem:
      type: object
      required: [status, label, count]
      properties:
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        label:
          type: string
          example: Открытые
        count:
          type: integer
          minimum: 0
        hint:
          type: string
          description: Подсказка под подписью (например «всего» для закрытых)
          example: в работе

    ApplicationsSummary:
      type: object
      required: [activeCount, items]
      description: |
        Сводка по заявкам (Application). Заменяет пустой блок «Финансовая статистика».
        activeCount — OPENED + WAITING + POSTPONED.
      properties:
        activeCount:
          type: integer
          example: 29
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationsSummaryItem"

    ActivityStatus:
      type: string
      enum: [success, warning, info]
      description: Цвет индикатора в «Недавняя активность»

    RecentActivityItem:
      type: object
      required: [apartmentLabel, action, occurredAt, status]
      properties:
        apartmentLabel:
          type: string
          description: Полный адрес квартиры для отображения
          example: ЖК «Солнечный город», дом 2, кв. 45
        action:
          type: string
          description: |
            Тип события: новый/продлённый договор (`Contract`), заявка (`Application`),
            просрочка счёта (`ContractPayment.status = OVERDUE`).
          example: Новый договор аренды
        occurredAt:
          type: string
          format: date-time
          description: ISO timestamp; фронт может форматировать как «2 часа назад»
        status:
          $ref: "#/components/schemas/ActivityStatus"

    OccupancyChartItem:
      type: object
      required: [name, occupancyPercent, totalUnits]
      properties:
        name:
          type: string
          description: Название ЖК или дома
          example: Солнечный город
        occupancyPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Доля Flat.status OCCUPIED на сегодня
          example: 85
        totalUnits:
          type: integer
          description: COUNT(Flat) в группе
          example: 24

    FlatStatus:
      type: string
      enum: [OCCUPIED, UNOCCUPIED, RENOVATING]
      description: |
        `Flat.status` (`EnumFlatStatus`). Подписи на фронте:
        OCCUPIED → «Занята», UNOCCUPIED → «Свободна», RENOVATING → «Ремонт».

    FlatsByStatusChartItem:
      type: object
      required: [status, count]
      properties:
        status:
          $ref: "#/components/schemas/FlatStatus"
        count:
          type: integer
          minimum: 0

    RentIncomeChartItem:
      type: object
      required: [periodLabel, revenue]
      description: |
        «Финансовая динамика» — только поступления. Расходов на уровне УК в БД нет
        (`FlatExpenses` — справочник по квартире, не агрегат дашборда).
      properties:
        periodLabel:
          type: string
          description: Подпись оси X («Янв», «Фев» или ISO month)
          example: Янв
        revenue:
          $ref: "#/components/schemas/Money"
          description: SUM(Transaction.amount) за период

    PaymentsDynamicChartItem:
      type: object
      required: [periodLabel, paid, unpaid]
      properties:
        periodLabel:
          type: string
          example: Янв
        paid:
          type: integer
          description: ContractPayment со статусом PAYED за период (есть Transaction)
          example: 420
        unpaid:
          type: integer
          description: OVERDUE и WAITING без оплаты за период
          example: 45

    RequestsDynamicChartItem:
      type: object
      required: [periodLabel, created, closed, inProgress]
      properties:
        periodLabel:
          type: string
          example: Янв
        created:
          type: integer
          description: Новые `Application` за период
          example: 245
        closed:
          type: integer
          description: Application.status CLOSED
          example: 220
        inProgress:
          type: integer
          description: OPENED, WAITING, POSTPONED
          example: 25

    ContractPaymentStatus:
      type: string
      enum: [WAITING, PENDING, PAYED, OVERDUE]
      description: |
        `ContractPayment.status` (`EnumContractPaymentStatus`). Подписи:
        WAITING → «Ожидается», PENDING → «В процессе», PAYED → «Оплачено», OVERDUE → «Просрочено».

    PaymentStatusChartItem:
      type: object
      required: [status, count]
      properties:
        status:
          $ref: "#/components/schemas/ContractPaymentStatus"
        count:
          type: integer
          minimum: 0

    ExpiringContractsChartItem:
      type: object
      required: [name, count]
      description: |
        Договоры с Contract.end_date в окне [сегодня; сегодня + withinDays],
        договор активен (start_date ≤ сегодня ≤ end_date).
        name — ApartmentComplex.name или Sector (дом).
      properties:
        name:
          type: string
          example: Солнечный город
        count:
          type: integer
          minimum: 0
          example: 5

    ExpiringContractsChart:
      type: object
      required: [withinDays, totalCount, items]
      properties:
        withinDays:
          type: integer
          example: 30
          description: Горизонт «истекают в ближайшие N дней»
        totalCount:
          type: integer
          minimum: 0
          example: 12
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpiringContractsChartItem"

    DashboardResponse:
      type: object
      required:
        - metrics
        - applicationsSummary
        - recentActivity
        - occupancyChart
        - flatsByStatusChart
        - rentIncomeChart
        - paymentsDynamicChart
        - requestsDynamicChart
        - paymentStatusChart
        - expiringContractsChart
        - filters
      properties:
        metrics:
          $ref: "#/components/schemas/DashboardMetrics"
        applicationsSummary:
          $ref: "#/components/schemas/ApplicationsSummary"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/RecentActivityItem"
        occupancyChart:
          type: array
          items:
            $ref: "#/components/schemas/OccupancyChartItem"
        flatsByStatusChart:
          type: array
          items:
            $ref: "#/components/schemas/FlatsByStatusChartItem"
        rentIncomeChart:
          type: array
          items:
            $ref: "#/components/schemas/RentIncomeChartItem"
        paymentsDynamicChart:
          type: array
          items:
            $ref: "#/components/schemas/PaymentsDynamicChartItem"
        requestsDynamicChart:
          type: array
          items:
            $ref: "#/components/schemas/RequestsDynamicChartItem"
        paymentStatusChart:
          type: array
          items:
            $ref: "#/components/schemas/PaymentStatusChartItem"
        expiringContractsChart:
          $ref: "#/components/schemas/ExpiringContractsChart"
        filters:
          $ref: "#/components/schemas/DashboardFiltersApplied"

    DashboardFiltersApplied:
      type: object
      required: [complexId, dateFrom, dateTo]
      description: Эхо применённых фильтров для отладки и синхронизации UI
      properties:
        complexId:
          type: ["integer", "null"]
          description: null — все ЖК (клиентское `all`)
        dateFrom:
          type: ["string", "null"]
          format: date
        dateTo:
          type: ["string", "null"]
          format: date

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
          example: Неверный email или пароль

    ValidationErrorResponse:
      type: object
      required: [code, message, errors]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Ошибка валидации
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: password
              message:
                type: string
                example: Пароль должен содержать минимум 6 символов

security:
  - bearerAuth: []
